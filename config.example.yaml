# A sample AgentCarto configuration.
#
# This file is merged onto the built-in defaults: write only the keys you want to
# change. Plugins are merged by id.
#
# Where to put it (found and read automatically):
#   Linux   : ${XDG_CONFIG_HOME:-~/.config}/agentcarto/config.yaml
#   macOS   : ~/Library/Application Support/agentcarto/config.yaml
#   Windows : %AppData%\agentcarto\config.yaml
#
# Naming one explicitly, and checking it:
#   agentcarto --config ./config.example.yaml config validate   # check the settings
#   agentcarto --config ./config.example.yaml config print      # print them as merged
#   agentcarto --config ./config.example.yaml plugins list      # list plugins and capabilities

version: 1

ui:
  refresh_interval: 2s      # how often the screen is redrawn (running sessions, elapsed times)
  rescan_interval: 3s       # how often sessions are scanned again
  default_view: time        # the list's starting view: time | folder

index:
  max_chars_per_session: 131072  # bytes of one session held in the full-text index (a third as many characters in Japanese)

cache:
  enabled: true
  cache_conversations: true
  max_size: 512MiB          # units: B / KiB / MiB / GiB
  max_age: 720h             # durations: 30m, 12h, 720h

# Generated summaries — the per-turn lines and the session's own, shown by
# `agentcarto show` and in the TUI.
#
# Generating them runs an AI agent's CLI, which costs money and sends the
# session's contents to that agent's provider. Nothing is generated while agent
# is empty, which is the default.
summary:
  agent: ""                 # claude / codex / "" (empty generates nothing)
  model: claude-sonnet-5    # passed to that CLI; required once agent is set
  timeout: 10m              # bounds one session's generation
  max_per_run: 20           # sessions one background run will summarize
  session_interval: 1h      # shortest gap between two writes of a session's own summary
                            # (per-turn summaries are not held back by it)
  language: ""              # what the summaries are written in
                            # empty follows the session's own language; otherwise name one
                            # as you would say it: English / 日本語 / Français

# One plugin per agent. Each runs as its own executable (a subprocess); type is
# the identifier a plugin answers to. The executable is looked for beside the
# agentcarto binary and then on PATH, as "agentcarto-plugin-<type>" — name it
# with command when it lives somewhere else.
#
# color is one of default/black/red/green/yellow/blue/magenta/cyan/white/orange,
# or any of those as bright-*.
plugins:
  - id: claude
    type: claude
    enabled: true
    color: cyan
    # command: /opt/agentcarto/agentcarto-plugin-claude   # an explicit path to the executable
    options: {}
  - id: codex
    type: codex
    enabled: true
    color: red
    options: {}
  - id: grok
    type: grok
    enabled: true
    color: magenta
    options: {}
  - id: copilot-vc        # GitHub Copilot Chat (VS Code)
    type: copilot-vc
    enabled: true
    color: orange
    options: {}
  - id: copilot-jb        # GitHub Copilot Chat (JetBrains)
    type: copilot-jb
    enabled: true
    color: yellow
    options: {}
